<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#1a1a2e" />
<title>全球宏观投研交易 | 连接机构级投研能力与个人交易者的桥梁</title>
<style>
/* ============ RESET ============ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",system-ui,-apple-system,sans-serif;overflow-x:hidden;line-height:1.5;color:#fff;background:#1a1a2e}
:root{--inst-900:#1a1a2e;--inst-800:#16213e;--retail-900:#0f3460;--retail-accent:#e94560;--retail-gold:#f5c542;--txt:#fff;--txt-dim:#94a3b8;--bg:#fff;--bg-dark:#1a1a2e;--glass-bg:rgba(255,255,255,.08);--glass-border:rgba(255,255,255,.14);--card:#fff}
html.dark{--txt:#fff;--bg:#1a1a2e;--glass-bg:rgba(255,255,255,.08);--glass-border:rgba(255,255,255,.14);--card:rgba(255,255,255,.05);--txt-dim:#94a3b8}
html:not(.dark){--txt:#1a1a2e;--bg:#f8fafc;--glass-bg:rgba(255,255,255,.7);--glass-border:rgba(15,52,96,.12);--card:#fff;--txt-dim:#64748b}
.num{font-family:"Roboto Mono","DIN Alternate","SF Mono",monospace;font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}

/* ============ LAYOUT ============ */
.glass{background:var(--glass-bg);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);border:1px solid var(--glass-border)}
.container{max-width:1100px;margin:0 auto;padding:0 20px}
.hide-scroll::-webkit-scrollbar{display:none}.hide-scroll{-ms-overflow-style:none;scrollbar-width:none}
.gold-text{background:linear-gradient(120deg,#f5c542,#e9b416,#fbd978,#f5c542);background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:shimmer 3s linear infinite}
.grid-bg{background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:40px 40px}
html:not(.dark) .grid-bg{background-image:linear-gradient(rgba(15,52,96,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(15,52,96,.04) 1px,transparent 1px)}

/* ============ ANIM ============ */
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes fadeUp{0%{opacity:0;transform:translateY(24px)}100%{opacity:1;transform:translateY(0)}}
@keyframes slideIn{0%{opacity:0;transform:translateX(40px)}100%{opacity:1;transform:translateX(0)}}
@keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes ping{0%{transform:scale(1);opacity:1}75%,100%{transform:scale(2);opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.fade-up{animation:fadeUp .6s ease forwards;opacity:0}
.float-anim{animation:float 6s ease-in-out infinite}
.card-hover{transition:transform .35s cubic-bezier(.22,1,.36,1),box-shadow .35s ease}
.card-hover:hover{transform:translateY(-8px)}
.reveal{opacity:0;transform:translateY(28px);transition:opacity .7s cubic-bezier(.22,1,.36,1),transform .7s cubic-bezier(.22,1,.36,1)}
.reveal.in{opacity:1;transform:translateY(0)}

/* page transition */
.page{animation:pageIn .5s cubic-bezier(.22,1,.36,1) forwards}
@keyframes pageIn{0%{opacity:0;transform:translateX(30px)}100%{opacity:1;transform:translateX(0)}}

/* flip card */
.flip{perspective:1400px}
.flip-inner{position:relative;transition:transform .7s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d}
.flip.flipped .flip-inner{transform:rotateY(180deg)}
.flip-face{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip-back{position:absolute;inset:0;transform:rotateY(180deg)}

/* tool tip */
.tool{position:relative}
.tip{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%) translateY(6px);opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;white-space:nowrap;z-index:20}
.tool:hover .tip{opacity:1;transform:translateX(-50%) translateY(0)}

/* ============ TOP BAR ============ */
.topbar{position:fixed;top:0;left:0;right:0;z-index:60;display:flex;align-items:center;justify-content:center;gap:8px;padding:7px 16px;font-size:12px;color:#fff;background:linear-gradient(90deg,#0f3460,#16213e,#0f3460)}
.topbar .dot{width:7px;height:7px;border-radius:50%;background:var(--retail-accent);position:relative}
.topbar .dot::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--retail-accent);animation:ping 1.6s ease-in-out infinite}
.topbar .close{margin-left:6px;color:rgba(255,255,255,.6);font-size:16px;line-height:1}

/* ============ NAV ============ */
.nav{position:fixed;top:36px;left:50%;transform:translateX(-50%);z-index:55}
@media(min-width:768px){.nav{top:10px}}
.nav-pills{display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px}
.nav-pills button{padding:6px 16px;border-radius:999px;font-size:13px;font-weight:500;color:var(--txt-dim);transition:.25s}
html:not(.dark) .nav-pills button{color:#475569}
.nav-pills button.on{color:#1a1a2e;background:linear-gradient(90deg,#f5c542,#e9b416)}
.nav-pills .theme{width:28px;height:28px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:50%;margin-left:4px}

/* ============ HERO ============ */
.hero{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background:var(--inst-900);padding:90px 0 40px}
html:not(.dark) .hero{background:#f1f5f9}
.hero-canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.7}
html:not(.dark) .hero-canvas{opacity:.5}
.hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}
.hero .hero-img{opacity:.5}
html:not(.dark) .hero .hero-img{opacity:.25}
.retail-hero .hero-img{opacity:.4}
.hero-fade{position:absolute;inset:0;background:linear-gradient(to bottom,transparent,transparent 40%,var(--inst-900));pointer-events:none}
html:not(.dark) .hero-fade{background:linear-gradient(to bottom,transparent,transparent 40%,#f1f5f9)}
.hero-inner{position:relative;z-index:10;width:100%;max-width:1100px;margin:0 auto;padding:0 20px;text-align:center}
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:999px;font-size:12px;color:#cbd5e1;margin-bottom:22px}
html:not(.dark) .badge{color:#475569}
h1{font-size:clamp(32px,8vw,68px);font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:0}
h1 .accent{display:block}
.hero-sub{margin:18px auto 0;max-width:600px;font-size:clamp(14px,3.6vw,20px);color:#cbd5e1}
html:not(.dark) .hero-sub{color:#475569}
.dual{display:grid;grid-template-columns:1fr;gap:16px;margin:42px auto 0;max-width:820px;width:100%}
@media(min-width:768px){.dual{grid-template-columns:1fr 1fr;gap:22px}}
.dual .card{position:relative;text-align:left;border-radius:24px;padding:28px;overflow:hidden;transition:transform .35s,box-shadow .35s}
.dual .card:hover{transform:translateY(-8px)}
.dual .inst-card{background:linear-gradient(145deg,#1a1a2e,#16213e);color:#fff}
.dual .retail-card{background:linear-gradient(145deg,#0f3460,#1a4a7a);border:1px solid rgba(245,197,66,.3);color:#fff}
.recommend{position:absolute;top:14px;right:16px;font-size:10px;font-weight:700;color:var(--retail-gold);background:rgba(245,197,66,.12);padding:2px 8px;border-radius:999px}
.dual .glow{position:absolute;top:-40px;right:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.05);filter:blur(40px)}
.dual .retail-card .glow{background:rgba(245,197,66,.2)}
.dual .ico{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;margin-bottom:20px}
.dual .inst-card .ico{background:rgba(255,255,255,.08);color:#cbd5e1}
.dual .retail-card .ico{background:linear-gradient(135deg,#f5c542,#e9b416);color:#1a1a2e}
.dual .kicker{font-size:12px;margin-bottom:4px}
.dual .inst-card .kicker{color:#64748b}
.dual .retail-card .kicker{color:var(--retail-gold)}
.dual .card h3{font-size:22px;font-weight:800;margin:0 0 8px}
.dual .card p{font-size:14px;color:#cbd5e1;line-height:1.6;margin:0}
.dual .retail-card p{color:#e2e8f0}
.dual .go{display:inline-flex;align-items:center;gap:6px;margin-top:22px;font-size:14px;color:#e2e8f0;transition:.25s}
.dual .retail-card .go{color:var(--retail-gold)}
.dual .card:hover .go{color:#fff}
.dual .go svg{transition:transform .25s}
.dual .card:hover .go svg{transform:translateX(4px)}

/* trust */
.trust{position:relative;z-index:10;width:100%;max-width:1100px;margin:0 auto;padding:0 20px;margin-top:54px}
.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:768px){.metrics{grid-template-columns:repeat(4,1fr)}}
.metric{border-radius:16px;padding:18px;text-align:center}
.metric .v{font-size:clamp(26px,6vw,40px);font-weight:800;color:#fff}
html:not(.dark) .metric .v{color:#1a1a2e}
.metric .v .suf{color:var(--retail-gold)}
.metric .l{font-size:12px;color:#94a3b8;margin-top:4px}
html:not(.dark) .metric .l{color:#64748b}
.marquee-wrap{overflow:hidden;padding:14px 0;margin-top:28px;border-top:1px solid rgba(255,255,255,.1);border-bottom:1px solid rgba(255,255,255,.1)}
html:not(.dark) .marquee-wrap{border-color:rgba(15,52,96,.1)}
.marquee{display:flex;gap:24px;white-space:nowrap;animation:marquee 28s linear infinite;width:max-content}
.marquee span{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:#64748b}
.marquee .d{width:6px;height:6px;border-radius:50%;background:var(--retail-accent)}

/* ============ SECTION ============ */
.section{padding:52px 0}
.section h2{font-size:clamp(24px,5vw,38px);font-weight:800;letter-spacing:-.01em}
html:not(.dark) h2,html:not(.dark) h3,html:not(.dark) h4{color:#1a1a2e}
.eyebrow{font-size:13px;color:var(--retail-gold);margin-bottom:6px;font-weight:600}
html:not(.dark) .eyebrow{color:#b8860b}
.center{text-align:center}
.sub{color:#94a3b8;font-size:14px;margin-top:8px}
html:not(.dark) .sub{color:#64748b}

/* institution */
.inst-page{min-height:100vh;background:var(--inst-900);color:#fff;padding-top:24px}
html:not(.dark) .inst-page{background:#f8fafc;color:#1a1a2e}
.pains{display:grid;grid-template-columns:1fr;gap:16px;margin-top:30px}
@media(min-width:768px){.pains{grid-template-columns:repeat(3,1fr)}}
.pain{border-radius:16px;padding:24px}
.pain .n{font-size:28px;color:rgba(245,197,66,.4);margin-bottom:10px}
.pain h4{font-size:17px;font-weight:700;margin-bottom:8px}
.pain p{font-size:13px;color:#94a3b8;line-height:1.7}
html:not(.dark) .pain p{color:#64748b}
.solutions{display:grid;grid-template-columns:1fr;gap:16px;margin-top:30px}
@media(min-width:768px){.solutions{grid-template-columns:repeat(3,1fr)}}
.sol{border-radius:16px;padding:24px;border:1px solid;background:linear-gradient(160deg,rgba(22,33,62,.6),rgba(26,26,46,.4))}
html:not(.dark) .sol{background:#fff}
.sol .ico{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.sol .layer{font-size:12px;margin-bottom:10px;font-weight:600}
.sol ul{list-style:none;display:flex;flex-direction:column;gap:9px}
.sol li{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:#cbd5e1}
html:not(.dark) .sol li{color:#334155}
.diff{border-radius:24px;padding:36px;position:relative;overflow:hidden;background:linear-gradient(135deg,#16213e,#0f3460);margin-top:36px}
html:not(.dark) .diff{background:linear-gradient(135deg,#eff6ff,#dbeafe)}
.diff .glow{position:absolute;top:0;right:0;width:240px;height:240px;border-radius:50%;background:rgba(245,197,66,.1);filter:blur(60px)}
.diff h3{font-size:22px;font-weight:800;margin-bottom:18px}
.diff .row{display:grid;grid-template-columns:1fr;gap:20px}
@media(min-width:768px){.diff .row{grid-template-columns:1fr 1fr}}
.diff .t{color:var(--retail-gold);font-weight:700;font-size:14px;margin-bottom:6px}
.diff p{font-size:13px;color:#cbd5e1;line-height:1.7}
html:not(.dark) .diff p{color:#475569}

.pricing{display:grid;grid-template-columns:1fr;gap:30px;align-items:center;margin-top:36px}
@media(min-width:768px){.pricing{grid-template-columns:1.1fr .9fr}}
.pricing ul{list-style:none;display:flex;flex-direction:column;gap:10px;margin-top:20px}
.pricing li{display:flex;align-items:center;gap:8px;font-size:14px;color:#cbd5e1}
html:not(.dark) .pricing li{color:#334155}
.form{border-radius:20px;padding:28px}
.form h4{font-size:18px;font-weight:700;margin-bottom:14px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:#94a3b8;margin-bottom:6px}
html:not(.dark) .field label{color:#64748b}
.field input,.field textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:11px 14px;font-size:14px;color:#fff;outline:none;transition:.25s;resize:none}
html:not(.dark) .field input,html:not(.dark) .field textarea{background:#fff;border-color:#e2e8f0;color:#1a1a2e}
.field input:focus,.field textarea:focus{border-color:rgba(245,197,66,.5)}
.btn-gold{width:100%;padding:13px;border-radius:12px;font-weight:700;color:#1a1a2e;background:linear-gradient(90deg,#f5c542,#e9b416);transition:.2s}
.btn-gold:hover{filter:brightness(1.08)}
.form-ok{text-align:center;padding:40px 0}
.form-ok .ico{width:64px;height:64px;border-radius:50%;background:rgba(245,197,66,.2);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;color:var(--retail-gold)}

/* retail */
.retail-page{min-height:100vh;color:#fff;background:linear-gradient(180deg,#0f3460,#0a2647);padding-top:24px}
.retail-hero{position:relative;text-align:center;overflow:hidden;padding:60px 0 20px}
.retail-hero .canvas{position:absolute;inset:0;opacity:.5}
.retail-hero .inner{position:relative;z-index:2}
.assets{display:flex;gap:14px;overflow-x:auto;padding-bottom:14px;margin:0 -20px;padding-left:20px;padding-right:20px;scroll-snap-type:x mandatory}
.asset{flex:0 0 170px;scroll-snap-align:start;border-radius:16px;padding:16px;border:1px solid}
.asset .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.asset .nm{font-size:17px;font-weight:700}
.asset .tag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px}
.asset.long .tag{background:rgba(76,217,158,.15);color:#6ee7b7}
.asset.short .tag{background:rgba(233,69,96,.15);color:#fca5a5}
.asset .px{font-size:24px;font-weight:800}
.asset .chg{font-size:12px;margin-top:2px}
.asset.long .chg{color:#6ee7b7}.asset.short .chg{color:#fca5a5}
.asset .note{font-size:10px;color:#94a3b8;margin-top:12px;padding-top:8px;border-top:1px solid rgba(255,255,255,.1);line-height:1.5}
.asset .full{font-size:9px;color:#64748b;margin-top:6px}

.timeline{position:relative;margin-top:20px}
.tl-line{position:absolute;left:14px;top:0;bottom:0;width:2px;background:rgba(255,255,255,.1)}
@media(min-width:768px){.tl-line{left:50%;transform:translateX(-50%)}}
.tl-item{position:relative;display:flex;align-items:center;margin-bottom:28px}
.tl-dot{position:absolute;left:14px;width:12px;height:12px;border-radius:50%;background:var(--retail-gold);box-shadow:0 0 0 5px rgba(245,197,66,.2);transform:translateX(-50%);z-index:2}
@media(min-width:768px){.tl-dot{left:50%}}
.tl-card{padding-left:40px;width:100%}
@media(min-width:768px){.tl-card{width:50%;padding-left:0}.tl-item.left .tl-card{padding-right:48px;text-align:right}.tl-item.right{justify-content:flex-end}.tl-item.right .tl-card{padding-left:48px}}
.tl-inner{border-radius:16px;padding:18px}
.tl-stage{font-size:13px;font-weight:700;color:var(--retail-gold);margin-bottom:4px}
.tl-card h4{font-size:15px;font-weight:700;margin-bottom:4px}
.tl-card p{font-size:12px;color:#94a3b8;line-height:1.6}

.calc{border-radius:24px;padding:32px;position:relative;overflow:hidden;background:linear-gradient(135deg,#0f3460,#16213e);margin-top:20px}
html:not(.dark) .calc{background:linear-gradient(135deg,#1e3a8a,#1e40af)}
.calc .glow{position:absolute;bottom:-40px;right:-40px;width:180px;height:180px;border-radius:50%;background:rgba(245,197,66,.1);filter:blur(40px)}
.calc-grid{display:grid;grid-template-columns:1fr;gap:26px;align-items:center;position:relative}
@media(min-width:768px){.calc-grid{grid-template-columns:1fr 1fr}}
.calc h3{font-size:22px;font-weight:800;margin-bottom:10px}
.calc .desc{font-size:14px;color:#cbd5e1;line-height:1.7;margin-bottom:18px}
.calc-row{display:flex;align-items:center;gap:12px}
.calc-btn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff}
input[type=range]{flex:1;accent-color:var(--retail-gold)}
.calc-inv{margin-top:14px;display:flex;align-items:baseline;gap:6px}
.calc-inv .n{font-size:30px;font-weight:800;color:var(--retail-gold)}
.calc-box{border-radius:16px;padding:22px}
.calc-row2{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.calc-row2 .l{font-size:14px;color:#94a3b8}
.calc-row2 .v{font-size:17px}
.calc-row2 .strike{text-decoration:line-through;color:#64748b}
.calc-final{border-top:1px solid rgba(255,255,255,.1);padding-top:12px;margin-top:4px;display:flex;justify-content:space-between;align-items:baseline}
.calc-final .l{font-size:14px;color:#cbd5e1}
.calc-final .v{font-size:32px;font-weight:800}
.calc-free{margin-top:12px;text-align:center;font-size:12px;color:#6ee7b7}

.flip{width:100%;max-width:400px;margin:0 auto;cursor:pointer}
.flip-front,.flip-back{border-radius:24px;padding:30px;text-align:center;overflow:hidden}
.flip-front{background:linear-gradient(160deg,#0f3460,#16213e);border:2px solid rgba(245,197,66,.3);position:relative}
.flip-front .renew{position:absolute;top:14px;right:14px;font-size:10px;font-weight:700;color:var(--retail-gold);background:rgba(245,197,66,.15);padding:3px 8px;border-radius:999px}
.flip-front .m{font-size:13px;color:#94a3b8;margin-bottom:8px}
.flip-front .price{display:flex;align-items:baseline;justify-content:center;gap:4px}
.flip-front .price .c{font-size:20px;color:#94a3b8}
.flip-front .price .p{font-size:56px;font-weight:800}
.flip-front .price .y{font-size:13px;color:#94a3b8}
.flip-front .orig{font-size:12px;color:#64748b;text-decoration:line-through;margin-top:8px}
.flip-front .hint{margin-top:22px;font-size:12px;color:#94a3b8}
.cd{margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,.1)}
.cd .t{font-size:10px;color:#64748b;margin-bottom:4px}
.cd .n{font-size:18px;font-weight:800;color:var(--retail-accent)}
.cd-bar{width:100%;height:6px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:8px}
.cd-bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#f5c542,#e94560)}
.cd .s{font-size:9px;color:#64748b;margin-top:6px}
.flip-back{background:linear-gradient(160deg,#16213e,#1a1a2e);border:2px solid rgba(245,197,66,.3)}
.flip-back .t{font-size:13px;color:var(--retail-gold);font-weight:700;margin-bottom:14px}
.flip-back ul{list-style:none;text-align:left;display:flex;flex-direction:column;gap:10px}
.flip-back li{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:#e2e8f0}
.flip-back .hint{margin-top:18px;text-align:center;font-size:12px;color:#94a3b8}

.scan{border-radius:24px;padding:30px;text-align:center}
.scan h3{font-size:20px;font-weight:800;margin-bottom:8px}
.scan .d{font-size:14px;color:#94a3b8;margin-bottom:20px}
.scan-qr{width:140px;height:140px;border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto}

/* ============ K-LINE CANVAS ============ */
function mountCanvas(el,dark){
  const cv=el;const ctx=cv.getContext('2d');
  if(!ctx)return()=>{}; // 容错：无 canvas 上下文时安全跳过，避免白屏
  let raf,t=0,candles=[],linePts=[];
  function resize(){cv.width=cv.offsetWidth*devicePixelRatio;cv.height=cv.offsetHeight*devicePixelRatio;init();}
  function init(){
    const w=cv.width,h=cv.height;
    if(dark){
      candles=[];let price=h*0.5;const cw=14*dpr(),gap=4*dpr();const count=Math.ceil(w/(cw+gap))+2;
      for(let i=0;i<count;i++){const o=price;const d=(Math.random()-0.5)*h*0.04;const c=Math.max(20,Math.min(h-20,price+d));price=c;candles.push({o,c,hi:Math.min(o,c)-Math.random()*h*0.03,lo:Math.max(o,c)+Math.random()*h*0.03});}
    }
  }
  const dpr=()=>devicePixelRatio||1;
  function draw(){
    const w=cv.width,h=cv.height;ctx.clearRect(0,0,w,h);
    if(dark){
      const cw=14*dpr(),gap=4*dpr();
      candles.forEach((c,i)=>{const x=i*(cw+gap);const up=c.c>=c.o;ctx.strokeStyle=up?'rgba(76,217,158,.32)':'rgba(233,69,96,.30)';ctx.fillStyle=up?'rgba(76,217,158,.20)':'rgba(233,69,96,.18)';ctx.lineWidth=dpr();ctx.beginPath();ctx.moveTo(x+cw/2,c.hi);ctx.lineTo(x+cw/2,c.lo);ctx.stroke();const bt=Math.min(c.o,c.c);const bh=Math.max(Math.abs(c.c-c.o),2);ctx.fillRect(x,bt,cw,bh);});
      if(t%2===0){const last=candles[candles.length-1];const d=(Math.random()-0.5)*h*0.04;const c=Math.max(20,Math.min(h-20,last.c+d));candles.push({o:last.c,c,hi:Math.min(last.c,c)-Math.random()*h*0.03,lo:Math.max(last.c,c)+Math.random()*h*0.03});candles.shift();}
    }else{
      ctx.strokeStyle='rgba(15,52,96,.18)';ctx.lineWidth=2*dpr();ctx.beginPath();const sx=w/60;
      for(let i=0;i<=60;i++){const x=i*sx;const y=h*0.5+Math.sin(i*0.4+t*0.02)*h*0.15+Math.sin(i*0.13+t*0.015)*h*0.1;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}ctx.stroke();
      ctx.strokeStyle='rgba(233,69,96,.14)';ctx.beginPath();
      for(let i=0;i<=60;i++){const x=i*sx;const y=h*0.6+Math.cos(i*0.3+t*0.018)*h*0.12;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}ctx.stroke();
    }
    t++;raf=requestAnimationFrame(draw);
  }
  resize();draw();
  window.addEventListener('resize',resize);
  return ()=>{cancelAnimationFrame(raf);window.removeEventListener('resize',resize);};
}

function revealObs(root){
  const els=root.querySelectorAll('.reveal');
  const obs=new IntersectionObserver((es)=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');obs.unobserve(e.target);}})},{threshold:0.12});
  els.forEach(e=>obs.observe(e));
  return obs;
}
function countUp(el,target,dur=1400){
  let raf,start;const obs=new IntersectionObserver((es)=>{if(es[0].isIntersecting){const tick=(t)=>{if(!start)start=t;const p=Math.min((t-start)/dur,1);const e=1-Math.pow(1-p,3);el.textContent=Math.round(target*e).toLocaleString();if(p<1)raf=requestAnimationFrame(tick);};raf=requestAnimationFrame(tick);obs.disconnect();}},{threshold:0.3});
  obs.observe(el);
}

let invited=1;

function submitInst(){const f=document.getElementById('instForm');const v=id=>(document.getElementById(id)?.value||'').trim();if(!v('f1')||!v('f2')||!v('f3')||!v('f4')){alert('请填写完整信息');return;}f.innerHTML=`<div class="form-ok"><div class="ico">${svg(I.check,32)}</div><h4 style="font-size:18px;font-weight:700;margin-bottom:8px">申请已提交</h4><p class="d">机构销售将在 1 个工作日内与您联系，沟通定制方案。</p></div>`;}

}
