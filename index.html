<style>

/* ============ ROUTER ============ */
const app=document.getElementById('app');
function route(){
  const h=location.hash||'#/';
  let page='home';
  if(h.startsWith('#/retail'))page='retail';
  else if(h.startsWith('#/inst'))page='inst';
  document.body.className='t-'+page;
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.r===page));
  app.innerHTML=page==='retail'?renderRetail():page==='inst'?renderInst():renderHome();
  window.scrollTo(0,0);
  initPage(page);
}
addEventListener('hashchange',route);

/* ============ INTERACTIONS ============ */
let revTimer=null;
function initPage(page){
  /* reveal（无 IntersectionObserver 环境降级：直接显示） */
  if('IntersectionObserver' in window){
    const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);
      e.target.querySelectorAll('.cnt').forEach(animateCount);}}),{threshold:.12});
    document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
    const io2=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){animateCount(e.target);io2.unobserve(e.target)}}),{threshold:.4});
    document.querySelectorAll('.cnt').forEach(el=>io2.observe(el));
  }else{
    document.querySelectorAll('.reveal').forEach(el=>el.classList.add('in'));
    document.querySelectorAll('.cnt').forEach(el=>el.textContent=el.dataset.n);
  }
  /* carousel */
  if(revTimer){clearInterval(revTimer);revTimer=null}
  const revs=document.querySelectorAll('[data-rev]');
  if(revs.length){
    let cur=0;const dots=document.querySelectorAll('[data-dot]');
    const go=i=>{cur=(i+revs.length)%revs.length;revs.forEach((r,k)=>r.classList.toggle('on',k===cur));dots.forEach((d,k)=>d.classList.toggle('on',k===cur))};
    dots.forEach(d=>d.onclick=()=>{go(+d.dataset.dot);restart()});
    let restart=()=>{if(revTimer)clearInterval(revTimer);revTimer=setInterval(()=>go(cur+1),4500)};
    restart();
  }
  /* FAQ (inst) */
  document.querySelectorAll('.fq .q').forEach(q=>q.onclick=()=>{
    const box=q.parentElement;const open=box.classList.contains('open');
    box.parentElement.querySelectorAll('.fq').forEach(f=>f.classList.remove('open'));
    if(!open)box.classList.add('open');
  });
  /* canvas (inst) */
  const cv=document.getElementById('instCv');
  if(cv)mountCanvas(cv);
}
function animateCount(el){
  if(el.dataset.done)return;el.dataset.done=1;
  const n=+el.dataset.n,dur=900,t0=performance.now();
  const step=t=>{const p=Math.min(1,(t-t0)/dur);el.textContent=Math.round(n*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(step)};
  requestAnimationFrame(step);
}
function mountCanvas(cv){
  const ctx=cv.getContext('2d');if(!ctx)return;
  const dpr=window.devicePixelRatio||1;
  function draw(){
    const w=cv.offsetWidth,h=cv.offsetHeight;
    cv.width=w*dpr;cv.height=h*dpr;ctx.clearRect(0,0,cv.width,cv.height);
    const cw=11*dpr,gap=5*dpr,n=Math.ceil(cv.width/(cw+gap))+3;
    let price=cv.height*0.55;const candles=[];
    for(let i=0;i<n;i++){const o=price,d=(Math.random()-.5)*cv.height*.06,c=Math.max(14*dpr,Math.min(cv.height-14*dpr,price+d));price=c;
      candles.push({o,c,hi:Math.min(o,c)-Math.random()*cv.height*.02,lo:Math.max(o,c)+Math.random()*cv.height*.02});}
    candles.forEach((k,i)=>{const x=i*(cw+gap)+cw*.5;const up=k.c>=k.o;
      ctx.strokeStyle=up?'rgba(16,185,129,.4)':'rgba(239,68,68,.4)';ctx.lineWidth=1.4*dpr;
      ctx.beginPath();ctx.moveTo(x,k.hi);ctx.lineTo(x,k.lo);ctx.stroke();
      ctx.fillStyle=up?'rgba(16,185,129,.32)':'rgba(239,68,68,.32)';
      ctx.fillRect(x-cw/2,Math.min(k.o,k.c),cw,Math.max(2*dpr,Math.abs(k.c-k.o)));});
    /* 均线 */
    ctx.strokeStyle='rgba(59,130,246,.5)';ctx.lineWidth=1.6*dpr;ctx.beginPath();
    let y=cv.height*.5;for(let i=0;i<n;i++){y=y*.7+candles[i].c*.3;const x=i*(cw+gap)+cw*.5;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
    ctx.stroke();
  }
  draw();let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(draw,150)});
}
/* modal */
function openWx(){document.getElementById('wxModal').classList.add('on')}
function closeWx(){document.getElementById('wxModal').classList.remove('on')}
addEventListener('keydown',e=>{if(e.key==='Escape')closeWx()});
route();
</script>
